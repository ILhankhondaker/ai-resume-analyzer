name: Temporary dependency remediation

on:
  push:
    branches: [security/dependency-audit-fix-20261115]
    paths: [.github/workflows/dependency-remediate.yml]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify this is the clean security branch
        run: |
          test ! -e init
          ! grep -q 'node init' package.json
          ! grep -q 'new Function' react-router.config.ts
      - name: Fix audited dependency versions in lockfile
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Will verify remaining findings with npm audit"
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependency security
        run: npm audit --audit-level=high
      - name: Commit verified dependency lockfile updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: update audited dependency lockfile"
            git push origin HEAD:security/dependency-audit-fix-20261115
          fi
