name: Security CI

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install without package lifecycle scripts
        run: npm ci --ignore-scripts --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
